name: Medallion Architecture End-to-End Pipeline

# 1. Define triggers for the entire pipeline
on:
  schedule:
    # Runs automatically every day at 04:00 UTC (06:00 AM Cape Town Time SAST)
    - cron: '0 4 * * *'
  workflow_dispatch:
    # Allows you to trigger the complete pipeline manually from the GitHub UI

permissions:
  contents: write # Grants the workflow write access to commit files back to your repo
  
jobs:
  run-medallion-pipeline:
    runs-on: ubuntu-latest

    steps:
    # 2. Checkout your repository code
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # 3. Set up a secure Python environment on the runner
    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Caches packages to optimize action run times

    # 4. Install all pipeline dependencies across Bronze, Silver, and Gold layers
    - name: Install Layer Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas deltalake pyarrow duckdb

    # 5. Step 1: Execute Bronze Ingestion (Fetch API data)
    - name: Run Step 1 (Bronze Ingestion)
      run: python ingest_bronze_weather.py

    # 6. Step 2: Execute Silver Transformation (Clean & write to Delta Lake)
    - name: Run Step 2 (Silver Transformation)
      run: python transform_silver_weather.py

    # 7. Step 3: Execute Gold Aggregation (Run DuckDB SQL analytics)
    - name: Run Step 3 (Gold Aggregations)
      run: python aggregate_gold_weather.py

    # 8. Commit and Push all newly generated data tiers back into GitHub safely
    - name: Commit and Push Pipeline Artifacts
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        
        # Stage new entries across all three data layer directories
        git add data/bronze/ data/silver/ data/gold/
        
        # Only commit if actual analytical variations or data additions exist
        git diff --quiet && git diff --staged --quiet || (git commit -m "Feat: Auto-updated Medallion pipeline assets [skip ci]" && git push)
